# Integración continua: cada pull request y cada push a main compila y testea todo el sistema.
# Es el control que tiene que pasar un cambio antes de entrar a main (forma de trabajo en README.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  servicios:
    name: Go · ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [comun, gateway, identidad, operaciones, recursos, notificaciones, integracion]
    defaults:
      run:
        working-directory: servicios/${{ matrix.servicio }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: servicios/${{ matrix.servicio }}/go.mod
          cache-dependency-path: servicios/${{ matrix.servicio }}/go.sum
      - name: Formato
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Compilar
        run: go build ./...
      - name: Análisis estático
        run: go vet ./...
      - name: Tests
        run: go test ./...

  # Tests de punta a punta (ADR-028): levantan el sistema con el procedimiento único y recorren el
  # flujo de la Presentación por el gateway, como un cliente real.
  e2e:
    name: E2E · flujo de la Presentación
    needs: servicios
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pruebas/e2e/go.mod
          cache: false # el módulo no tiene dependencias (ni go.sum)
      - name: Configuración
        run: cp .env.example .env
      - name: Levantar el sistema
        run: docker compose up --build -d --wait
      # Las variables de .env pasan al entorno de los pasos siguientes. No se usa
      # `set -a; source .env`: la línea EXTERNO_ORGANIZACION_NOMBRE=Gestión de almacenamiento
      # (sin comillas) hace que bash intente ejecutar "de", y con bash -e el paso se corta.
      - name: Exportar las variables de .env
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .env >> "$GITHUB_ENV"
      - name: Tests de punta a punta
        working-directory: pruebas/e2e
        run: go test -tags e2e -count=1 -v ./...
      - name: Estado y logs del sistema (si falló)
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color
      - name: Bajar el sistema
        if: always()
        run: docker compose down -v

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Compilar
        run: npm run build
      - name: Tests
        run: npm test
