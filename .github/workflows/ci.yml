# Integración continua: cada pull request y cada push a main compila y testea todo el sistema.
# Es el control que tiene que pasar un cambio antes de entrar a main (forma de trabajo en README.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  servicios:
    name: Go · ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [comun, gateway, identidad, operaciones, recursos, notificaciones, integracion]
    defaults:
      run:
        working-directory: servicios/${{ matrix.servicio }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: servicios/${{ matrix.servicio }}/go.mod
          cache-dependency-path: servicios/${{ matrix.servicio }}/go.sum
      - name: Formato
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Compilar
        run: go build ./...
      - name: Análisis estático
        run: go vet ./...
      - name: Tests
        run: go test ./...
