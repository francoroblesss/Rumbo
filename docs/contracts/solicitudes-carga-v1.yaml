openapi: 3.1.0
info:
  title: Rumbo — Solicitar traslado de carga (REEMPLAZADO por la versión 2.0.0)
  version: 1.0.0
  description: |
    **REEMPLAZADO por la versión 2.0.0 (`traslados-v2.yaml`, ADR-006).** Esta versión nunca
    tuvo consumidores ni se implementó; se conserva como historia del contrato.

    Capacidad publicada por Rumbo para que un sistema externo (empresa de stock) solicite
    el traslado de carga entre dos ubicaciones y siga su resultado.

    El procesamiento es asíncrono: crear una solicitud devuelve `202 Accepted` con estado
    `RECIBIDA`. Un operador de Rumbo la revisa y la acepta, propone otro horario
    (`CONTRAPROPUESTA`) o la rechaza. El consumidor conoce cada cambio consultando la
    solicitud (polling). Documentación completa: `docs/contracts/README.md`.
servers:
  - url: http://localhost:4010
    description: Mock generado desde este contrato (Prism)
tags:
  - name: Autenticación
  - name: Solicitudes de carga
security:
  - bearerAuth: []

paths:
  /v1/auth/token:
    post:
      tags: [Autenticación]
      operationId: obtenerToken
      summary: Obtener un token de acceso (client credentials)
      description: |
        Intercambia las credenciales de la organización por un token firmado. El token se envía
        en cada llamada como `Authorization: Bearer <token>` hasta que vence (`expira_en_segundos`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoToken'
            example:
              client_id: org-stock-grupo-x
              client_secret: s3cr3t0-de-ejemplo
      responses:
        '200':
          description: Token emitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ejemplo.firma
                token_type: Bearer
                expira_en_segundos: 3600
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '429':
          $ref: '#/components/responses/DemasiadosPedidos'

  /v1/solicitudes-carga:
    post:
      tags: [Solicitudes de carga]
      operationId: crearSolicitudCarga
      summary: Solicitar un traslado de carga
      description: |
        Registra la necesidad de trasladar carga. **Recibir no es confirmar**: la respuesta
        `202` indica que la solicitud quedó registrada como `RECIBIDA`; el horario recién es
        un compromiso cuando la solicitud pasa a `ACEPTADA`.

        Requiere `Idempotency-Key`: reintentar con la misma clave y el mismo cuerpo devuelve la
        misma solicitud, sin duplicarla.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaSolicitudCarga'
            example:
              referencia_externa: TRF-2026-00123
              origen:
                nombre: Sucursal Centro
                direccion: Av. Colón 1234, Córdoba
                contacto: Depósito — 351 555-0101
              destino:
                nombre: Sucursal Cerro
                direccion: Av. Rafael Núñez 4500, Córdoba
                contacto: Recepción — 351 555-0202
              hora_llegada_solicitada: '2026-10-16T14:00:00-03:00'
              tolerancia_minutos: 120
              carga:
                descripcion: Cajas de mercadería seca
                bultos: 20
                peso_kg: 350
                volumen_m3: 2.5
              observaciones: Entrar por el portón de carga.
      responses:
        '202':
          description: Solicitud registrada con estado `RECIBIDA` (o la misma solicitud, si es un reintento idempotente).
          headers:
            Location:
              description: URL de la solicitud creada.
              schema:
                type: string
                example: /v1/solicitudes-carga/sol-7f3a9c
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudCarga'
              examples:
                recibida:
                  $ref: '#/components/examples/SolicitudRecibida'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/ClaveIdempotenciaReutilizada'
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
        '429':
          $ref: '#/components/responses/DemasiadosPedidos'
        '503':
          $ref: '#/components/responses/NoDisponible'
    get:
      tags: [Solicitudes de carga]
      operationId: listarSolicitudesCarga
      summary: Listar las solicitudes de la organización
      description: |
        Devuelve solo las solicitudes de la organización autenticada, ordenadas por
        `actualizado_en` ascendente. Para seguir los cambios por polling, enviar
        `actualizado_desde` con el mayor `actualizado_en` ya procesado.
      parameters:
        - name: actualizado_desde
          in: query
          description: Devuelve solo las solicitudes modificadas después de este instante (exclusivo).
          schema:
            type: string
            format: date-time
          example: '2026-10-15T09:00:00-03:00'
        - name: estado
          in: query
          description: Filtra por estado de la solicitud.
          schema:
            $ref: '#/components/schemas/EstadoSolicitud'
        - name: pagina
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: tamanio
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Página de solicitudes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaSolicitudes'
              example:
                resultados:
                  - id: sol-7f3a9c
                    referencia_externa: TRF-2026-00123
                    estado: ACEPTADA
                    origen:
                      nombre: Sucursal Centro
                      direccion: Av. Colón 1234, Córdoba
                    destino:
                      nombre: Sucursal Cerro
                      direccion: Av. Rafael Núñez 4500, Córdoba
                    hora_llegada_solicitada: '2026-10-16T14:00:00-03:00'
                    tolerancia_minutos: 120
                    carga:
                      descripcion: Cajas de mercadería seca
                      bultos: 20
                      peso_kg: 350
                    traslado:
                      id: tra-51c2e0
                      estado: PROGRAMADO
                      hora_llegada_comprometida: '2026-10-16T14:00:00-03:00'
                    creado_en: '2026-10-15T08:30:00-03:00'
                    actualizado_en: '2026-10-15T10:05:00-03:00'
                pagina: 1
                tamanio: 20
                total: 1
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '429':
          $ref: '#/components/responses/DemasiadosPedidos'
        '503':
          $ref: '#/components/responses/NoDisponible'

  /v1/solicitudes-carga/{id}:
    get:
      tags: [Solicitudes de carga]
      operationId: obtenerSolicitudCarga
      summary: Consultar una solicitud
      description: Estado actual de la solicitud y, si fue aceptada, de su traslado.
      parameters:
        - $ref: '#/components/parameters/IdSolicitud'
      responses:
        '200':
          description: Solicitud encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudCarga'
              examples:
                recibida:
                  $ref: '#/components/examples/SolicitudRecibida'
                contrapropuesta:
                  $ref: '#/components/examples/SolicitudContrapropuesta'
                completada:
                  $ref: '#/components/examples/SolicitudCompletada'
                rechazada:
                  $ref: '#/components/examples/SolicitudRechazada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrada'
        '429':
          $ref: '#/components/responses/DemasiadosPedidos'
        '503':
          $ref: '#/components/responses/NoDisponible'

  /v1/solicitudes-carga/{id}/respuesta-contrapropuesta:
    post:
      tags: [Solicitudes de carga]
      operationId: responderContrapropuesta
      summary: Aceptar o rechazar el horario propuesto por Rumbo
      description: |
        Solo es válido mientras la solicitud está en `CONTRAPROPUESTA` y antes de
        `contrapropuesta.vence_en` (24 h desde que se propuso). Aceptar → `ACEPTADA` con el horario
        propuesto como compromiso. Rechazar → `RECHAZADA_POR_CLIENTE`. Repetir la misma respuesta
        no tiene efecto adicional.
      parameters:
        - $ref: '#/components/parameters/IdSolicitud'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespuestaContrapropuesta'
            example:
              acepta: true
      responses:
        '200':
          description: Respuesta registrada; devuelve la solicitud actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudCarga'
              examples:
                aceptada:
                  $ref: '#/components/examples/SolicitudAceptadaTrasContrapropuesta'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrada'
        '409':
          $ref: '#/components/responses/EstadoNoPermite'
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
        '429':
          $ref: '#/components/responses/DemasiadosPedidos'
        '503':
          $ref: '#/components/responses/NoDisponible'

  /v1/solicitudes-carga/{id}/cancelacion:
    post:
      tags: [Solicitudes de carga]
      operationId: cancelarSolicitudCarga
      summary: Cancelar una solicitud o su traslado
      description: |
        - Antes de ser aceptada: la solicitud pasa a `CANCELADA`.
        - Aceptada, con **24 h o más** antes de la hora comprometida: el traslado pasa a `CANCELADO`.
        - Aceptada, con **menos de 24 h**: queda `cancelacion.estado = PENDIENTE_APROBACION` y un
          operador la aprueba o no. La cancelación queda registrada en ambos casos.
        - Con el traslado `EN_CURSO` o finalizado: no se puede cancelar (`409`).
      parameters:
        - $ref: '#/components/parameters/IdSolicitud'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoCancelacion'
            example:
              motivo: La mercadería se despachó por otro medio.
      responses:
        '200':
          description: Cancelación registrada; devuelve la solicitud actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudCarga'
              examples:
                tardia:
                  $ref: '#/components/examples/SolicitudCancelacionPendiente'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrada'
        '409':
          $ref: '#/components/responses/EstadoNoPermite'
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
        '429':
          $ref: '#/components/responses/DemasiadosPedidos'
        '503':
          $ref: '#/components/responses/NoDisponible'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token obtenido en `POST /v1/auth/token`.

  parameters:
    IdSolicitud:
      name: id
      in: path
      required: true
      description: Identificador de la solicitud asignado por Rumbo.
      schema:
        type: string
      example: sol-7f3a9c
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Clave única por intención (se recomienda un UUID). Rumbo la conserva 24 h junto con el
        cuerpo y el resultado: el mismo par clave + cuerpo devuelve el mismo resultado; la misma
        clave con otro cuerpo devuelve `409 CLAVE_IDEMPOTENCIA_REUTILIZADA`.
      schema:
        type: string
        minLength: 8
        maxLength: 128
      example: 3f6c1e2a-8b4d-4c1e-9a7f-2d5b6e8c9a01

  schemas:
    PedidoToken:
      type: object
      required: [client_id, client_secret]
      properties:
        client_id:
          type: string
        client_secret:
          type: string
    Token:
      type: object
      required: [access_token, token_type, expira_en_segundos]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expira_en_segundos:
          type: integer

    Ubicacion:
      type: object
      required: [nombre, direccion]
      properties:
        nombre:
          type: string
          maxLength: 120
          description: Nombre de la sucursal o lugar.
        direccion:
          type: string
          maxLength: 250
        contacto:
          type: string
          maxLength: 120
          description: Persona o teléfono para coordinar en el lugar.

    Carga:
      type: object
      required: [descripcion, bultos, peso_kg]
      properties:
        descripcion:
          type: string
          maxLength: 250
        bultos:
          type: integer
          minimum: 1
        peso_kg:
          type: number
          exclusiveMinimum: 0
        volumen_m3:
          type: number
          exclusiveMinimum: 0
          description: Opcional.

    NuevaSolicitudCarga:
      type: object
      required: [referencia_externa, origen, destino, hora_llegada_solicitada, carga]
      properties:
        referencia_externa:
          type: string
          maxLength: 64
          description: Identificador de la operación en el sistema del consumidor (Rumbo lo devuelve tal cual).
        origen:
          $ref: '#/components/schemas/Ubicacion'
        destino:
          $ref: '#/components/schemas/Ubicacion'
        hora_llegada_solicitada:
          type: string
          format: date-time
          description: Hora a la que la carga debe llegar al destino (ISO 8601 con zona horaria).
        tolerancia_minutos:
          type: integer
          minimum: 0
          maximum: 720
          default: 0
          description: Flexibilidad aceptada alrededor de la hora pedida. 0 = hora estricta.
        carga:
          $ref: '#/components/schemas/Carga'
        observaciones:
          type: string
          maxLength: 500

    EstadoSolicitud:
      type: string
      enum: [RECIBIDA, CONTRAPROPUESTA, ACEPTADA, RECHAZADA, RECHAZADA_POR_CLIENTE, CANCELADA]
      description: |
        - `RECIBIDA`: registrada, pendiente de revisión por un operador.
        - `CONTRAPROPUESTA`: Rumbo propone otro horario; el consumidor debe responder antes de `contrapropuesta.vence_en`.
        - `ACEPTADA`: el horario es un compromiso; existe `traslado`.
        - `RECHAZADA`: Rumbo no puede atenderla (ver `motivo_rechazo`). Final.
        - `RECHAZADA_POR_CLIENTE`: el consumidor rechazó la contrapropuesta o no respondió en 24 h. Final.
        - `CANCELADA`: el consumidor la canceló antes de ser aceptada. Final.

    EstadoTraslado:
      type: string
      enum: [PROGRAMADO, ASIGNADO, EN_CURSO, COMPLETADO, CANCELADO, NO_REALIZADO, INTERRUMPIDO]
      description: |
        - `PROGRAMADO`: incluido en un recorrido planificado.
        - `ASIGNADO`: el recorrido tiene chofer y vehículo.
        - `EN_CURSO`: el chofer inició el traslado.
        - `COMPLETADO`: la carga llegó al destino. Final.
        - `CANCELADO`: cancelado antes de iniciar. Final.
        - `NO_REALIZADO`: no se pudo retirar la carga. Final.
        - `INTERRUMPIDO`: empezó y no terminó (por ejemplo, avería). Final.

    Contrapropuesta:
      type: object
      required: [hora_llegada_propuesta, vence_en]
      properties:
        hora_llegada_propuesta:
          type: string
          format: date-time
        vence_en:
          type: string
          format: date-time
          description: Sin respuesta hasta este instante, la solicitud pasa a `RECHAZADA_POR_CLIENTE`.

    Traslado:
      type: object
      required: [id, estado, hora_llegada_comprometida]
      properties:
        id:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoTraslado'
        hora_llegada_comprometida:
          type: string
          format: date-time
        demora_minutos:
          type: integer
          minimum: 0
          description: Retraso informado durante la ejecución (la demora no es un estado).
        finalizado_en:
          type: string
          format: date-time
        detalle_resultado:
          type: string
          description: Explicación cuando el traslado es `NO_REALIZADO` o `INTERRUMPIDO`.

    Cancelacion:
      type: object
      required: [estado, solicitada_en]
      properties:
        estado:
          type: string
          enum: [PENDIENTE_APROBACION, APROBADA, RECHAZADA]
        motivo:
          type: string
        solicitada_en:
          type: string
          format: date-time

    SolicitudCarga:
      type: object
      required: [id, referencia_externa, estado, origen, destino, hora_llegada_solicitada, tolerancia_minutos, carga, creado_en, actualizado_en]
      properties:
        id:
          type: string
        referencia_externa:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoSolicitud'
        origen:
          $ref: '#/components/schemas/Ubicacion'
        destino:
          $ref: '#/components/schemas/Ubicacion'
        hora_llegada_solicitada:
          type: string
          format: date-time
        tolerancia_minutos:
          type: integer
        carga:
          $ref: '#/components/schemas/Carga'
        observaciones:
          type: string
        contrapropuesta:
          $ref: '#/components/schemas/Contrapropuesta'
        motivo_rechazo:
          type: string
        traslado:
          $ref: '#/components/schemas/Traslado'
        cancelacion:
          $ref: '#/components/schemas/Cancelacion'
        creado_en:
          type: string
          format: date-time
        actualizado_en:
          type: string
          format: date-time

    PaginaSolicitudes:
      type: object
      required: [resultados, pagina, tamanio, total]
      properties:
        resultados:
          type: array
          items:
            $ref: '#/components/schemas/SolicitudCarga'
        pagina:
          type: integer
        tamanio:
          type: integer
        total:
          type: integer

    RespuestaContrapropuesta:
      type: object
      required: [acepta]
      properties:
        acepta:
          type: boolean

    PedidoCancelacion:
      type: object
      required: [motivo]
      properties:
        motivo:
          type: string
          maxLength: 500

    Problema:
      type: object
      description: Error en formato Problem Details (RFC 9457), con un `codigo` estable para que el consumidor decida qué hacer.
      required: [type, title, status, codigo]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        codigo:
          type: string
          enum:
            - JSON_MAL_FORMADO
            - DATOS_INVALIDOS
            - NO_AUTENTICADO
            - SIN_PERMISO
            - NO_ENCONTRADA
            - CLAVE_IDEMPOTENCIA_REUTILIZADA
            - ESTADO_NO_PERMITE_OPERACION
            - CONTRAPROPUESTA_VENCIDA
            - HORARIO_EN_EL_PASADO
            - ANTICIPACION_INSUFICIENTE
            - CARGA_EXCEDE_CAPACIDAD
            - DEMASIADOS_PEDIDOS
            - SERVICIO_NO_DISPONIBLE
        errores:
          type: array
          description: Detalle por campo cuando `codigo = DATOS_INVALIDOS`.
          items:
            type: object
            properties:
              campo:
                type: string
              mensaje:
                type: string

  responses:
    PedidoInvalido:
      description: El cuerpo no es JSON válido o un parámetro tiene un formato inválido. No reintentar sin corregir.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://rumbo.example/errores/json-mal-formado
            title: Pedido mal formado
            status: 400
            codigo: JSON_MAL_FORMADO
    NoAutenticado:
      description: Falta el token, está vencido o es inválido (o credenciales incorrectas en `/v1/auth/token`). Obtener un token nuevo.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://rumbo.example/errores/no-autenticado
            title: No autenticado
            status: 401
            codigo: NO_AUTENTICADO
    SinPermiso:
      description: La organización autenticada no está habilitada para solicitar traslados de carga.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://rumbo.example/errores/sin-permiso
            title: Sin permiso
            status: 403
            codigo: SIN_PERMISO
    NoEncontrada:
      description: La solicitud no existe o pertenece a otra organización.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://rumbo.example/errores/no-encontrada
            title: Solicitud no encontrada
            status: 404
            codigo: NO_ENCONTRADA
    ClaveIdempotenciaReutilizada:
      description: La `Idempotency-Key` ya se usó con un cuerpo distinto. Usar una clave nueva para una intención nueva.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://rumbo.example/errores/clave-idempotencia-reutilizada
            title: Clave de idempotencia reutilizada
            status: 409
            codigo: CLAVE_IDEMPOTENCIA_REUTILIZADA
    EstadoNoPermite:
      description: El estado actual no admite la operación (por ejemplo, responder una contrapropuesta vencida o cancelar un traslado en curso). No reintentar; consultar la solicitud.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://rumbo.example/errores/estado-no-permite-operacion
            title: El estado actual no permite la operación
            status: 409
            codigo: ESTADO_NO_PERMITE_OPERACION
            detail: El traslado ya está EN_CURSO.
    ReglaDeNegocio:
      description: |
        Los datos no cumplen el contrato (`DATOS_INVALIDOS`, con detalle por campo en `errores`) o no
        cumplen una regla de negocio (`HORARIO_EN_EL_PASADO`, `ANTICIPACION_INSUFICIENTE`,
        `CARGA_EXCEDE_CAPACIDAD`). No reintentar sin cambiar el pedido.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            datosInvalidos:
              value:
                type: https://rumbo.example/errores/datos-invalidos
                title: Datos inválidos
                status: 422
                codigo: DATOS_INVALIDOS
                errores:
                  - campo: carga.peso_kg
                    mensaje: es obligatorio y debe ser mayor que 0
            cargaExcedeCapacidad:
              value:
                type: https://rumbo.example/errores/carga-excede-capacidad
                title: La carga excede la capacidad de la flota
