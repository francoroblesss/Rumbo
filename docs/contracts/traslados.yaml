openapi: 3.1.0
info:
  title: Rumbo — Reservar traslado
  version: 4.0.0
  description: |
    Capacidad publicada por Rumbo para que un sistema externo **reserve el traslado de una cosa
    desde un origen hasta un destino** en una franja horaria, y siga su resultado.

    **Autoservicio, sin negociación:** cada operación tiene una respuesta definitiva en el
    momento, sin que nadie de Rumbo ni del consumidor tenga que intervenir:
    1. `GET /disponibilidad` dice qué franjas de un día tienen lugar para la carga;
    2. `POST /traslados` reserva una franja: `201` con el traslado `PROGRAMADO` (es un
       compromiso de Rumbo) o `409 SIN_DISPONIBILIDAD` si la franja ya no tiene lugar;
    3. `GET /traslados/{id}` y `GET /traslados?actualizado_desde=` informan el avance;
    4. `POST /traslados/{id}/cancelacion` cancela en el momento si el traslado no empezó.

    Rumbo nunca devuelve un pedido "pendiente de revisión" ni propone otro horario: si no hay
    lugar, lo dice al instante y el consumidor elige otra franja.

    **Las rutas no llevan versión**: la versión del contrato es la de este documento
    (`info.version`) y cada cambio queda en el historial de `docs/contracts/README.md`
    (ADR-019). Reemplaza a la versión 3.0.0 (`traslados-v3.yaml`, ADR-021).
    Documentación completa: `docs/contracts/README.md`.
servers:
  - url: http://localhost:4010
    description: Mock generado desde este contrato (Prism)
tags:
  - name: Autenticación
  - name: Disponibilidad
  - name: Traslados
security:
  - bearerAuth: []

paths:
  /auth/token:
    post:
      tags: [Autenticación]
      operationId: obtenerToken
      summary: Obtener un token de acceso (client credentials)
      description: |
        Intercambia las credenciales de la organización por un token firmado. El token se envía
        en cada llamada como `Authorization: Bearer <token>` hasta que vence (`expira_en_segundos`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoToken'
            example:
              client_id: org-stock-grupo-x
              client_secret: s3cr3t0-de-ejemplo
      responses:
        '200':
          description: Token emitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ejemplo.firma
                token_type: Bearer
                expira_en_segundos: 3600
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '429':
          $ref: '#/components/responses/DemasiadosPedidos'
        '502':
          $ref: '#/components/responses/ErrorDePuerta'
        '504':
          $ref: '#/components/responses/TiempoAgotado'

  /disponibilidad:
    get:
      tags: [Disponibilidad]
      operationId: consultarDisponibilidad
      summary: Franjas de un día que todavía se pueden reservar
      description: |
        Devuelve las franjas de la fecha (hora de Argentina) que todavía se pueden reservar, con
        el lugar que les queda. Con `peso_kg`, `disponible` indica si esa carga entra.

        - Las franjas son de 2 h entre las 08:00 y las 20:00.
        - Se reserva con al menos **2 h** de anticipación y hasta **30 días** adelante; las franjas
          que ya no cumplen eso no aparecen.
        - Es una consulta, no una reserva: otro consumidor puede tomar el último lugar entre la
          consulta y el `POST /traslados`. Quien decide es la reserva.
      parameters:
        - name: fecha
          in: query
          required: true
          description: Día a consultar (AAAA-MM-DD, hora de Argentina). Desde hoy y hasta 30 días adelante.
          schema:
            type: string
            format: date
          example: '2026-11-20'
        - name: peso_kg
          in: query
          description: Opcional. Peso total de la carga a reservar.
          schema:
            type: number
            exclusiveMinimum: 0
          example: 350
      responses:
        '200':
          description: Franjas reservables de la fecha (lista vacía si ya no queda ninguna).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disponibilidad'
              example:
                fecha: '2026-11-20'
                franjas:
                  - inicio: '2026-11-20T08:00:00-03:00'
                    fin: '2026-11-20T10:00:00-03:00'
                    disponible: true
                    traslados_disponibles: 4
                    kg_disponibles: 2000
                  - inicio: '2026-11-20T10:00:00-03:00'
                    fin: '2026-11-20T12:00:00-03:00'
                    disponible: false
                    traslados_disponibles: 1
                    kg_disponibles: 150
                  - inicio: '2026-11-20T12:00:00-03:00'
                    fin: '2026-11-20T14:00:00-03:00'
                    disponible: false
                    traslados_disponibles: 0
                    kg_disponibles: 600
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
        '429':
          $ref: '#/components/responses/DemasiadosPedidos'
        '503':
          $ref: '#/components/responses/NoDisponible'
        '502':
          $ref: '#/components/responses/ErrorDePuerta'
        '504':
          $ref: '#/components/responses/TiempoAgotado'

  /traslados:
    post:
      tags: [Traslados]
      operationId: reservarTraslado
      summary: Reservar un traslado en una franja
      description: |
        Reserva el traslado de `cosa` desde `origen` hasta `destino`, para que llegue dentro de la
        franja que empieza en `franja_inicio` (uno de los `inicio` de `GET /disponibilidad`).

        La respuesta es definitiva:
        - `201`: reservado. El traslado queda `PROGRAMADO` y Rumbo se compromete a que la cosa
          llegue antes de `franja.fin`.
        - `409 SIN_DISPONIBILIDAD`: la franja ya no tiene lugar para esta carga. Consultar la
          disponibilidad y elegir otra franja (con otra `Idempotency-Key`).
        - `422`: datos inválidos o una regla de negocio (ver `codigo`).

        Requiere `Idempotency-Key`: reintentar con la misma clave y el mismo cuerpo devuelve la
        misma reserva, sin tomar otro lugar, aunque mientras tanto la franja se haya llenado.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoTraslado'
            examples:
              completo:
                summary: Con peso, referencia y observaciones
                value:
                  referencia_externa: TRF-2026-00123
                  cosa:
                    descripcion: Cajas de mercadería seca
                    cantidad: 20
                    peso_kg: 350
                    volumen_m3: 2.5
                  origen:
                    nombre: Sucursal Centro
                    direccion: Av. Colón 1234, Córdoba
                    contacto: Depósito — 351 555-0101
                  destino:
                    nombre: Sucursal Cerro
                    direccion: Av. Rafael Núñez 4500, Córdoba
                    contacto: Recepción — 351 555-0202
                  franja_inicio: '2026-11-20T10:00:00-03:00'
                  observaciones: Entrar por el portón de carga.
              minimo:
                summary: Solo lo obligatorio (cosa, origen, destino y franja)
                value:
                  cosa:
                    descripcion: Cajas de mercadería seca
                    cantidad: 20
                  origen:
                    nombre: Sucursal Centro
                    direccion: Av. Colón 1234, Córdoba
                  destino:
                    nombre: Sucursal Cerro
                    direccion: Av. Rafael Núñez 4500, Córdoba
                  franja_inicio: '2026-11-20T10:00:00-03:00'
      responses:
        '201':
          description: Traslado reservado (o la misma reserva, si es un reintento idempotente).
          headers:
            Location:
              description: URL del traslado reservado.
              schema:
                type: string
                example: /traslados/sol-7f3a9c
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrasladoReservado'
              examples:
                programado:
                  $ref: '#/components/examples/TrasladoProgramado'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/ConflictoReserva'
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
        '429':
          $ref: '#/components/responses/DemasiadosPedidos'
        '503':
          $ref: '#/components/responses/NoDisponible'
        '502':
          $ref: '#/components/responses/ErrorDePuerta'
        '504':
          $ref: '#/components/responses/TiempoAgotado'
    get:
      tags: [Traslados]
      operationId: listarTraslados
      summary: Listar los traslados de la organización
      description: |
        Devuelve solo los traslados de la organización autenticada, ordenados por
        `actualizado_en` ascendente. Para seguir los cambios por polling, enviar
        `actualizado_desde` con el mayor `actualizado_en` ya procesado.
      parameters:
        - name: actualizado_desde
          in: query
          description: Devuelve solo los traslados modificados después de este instante (exclusivo).
          schema:
            type: string
            format: date-time
          example: '2026-11-19T09:00:00-03:00'
        - name: estado
          in: query
          description: Filtra por estado del traslado.
          schema:
            $ref: '#/components/schemas/EstadoTraslado'
        - name: pagina
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: tamanio
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Página de traslados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaTraslados'
              example:
                resultados:
                  - id: sol-7f3a9c
                    referencia_externa: TRF-2026-00123
                    estado: ASIGNADO
                    cosa:
                      descripcion: Cajas de mercadería seca
                      cantidad: 20
                      peso_kg: 350
                    origen:
                      nombre: Sucursal Centro
                      direccion: Av. Colón 1234, Córdoba
                    destino:
                      nombre: Sucursal Cerro
                      direccion: Av. Rafael Núñez 4500, Córdoba
                    franja:
                      inicio: '2026-11-20T10:00:00-03:00'
                      fin: '2026-11-20T12:00:00-03:00'
                    creado_en: '2026-11-19T08:30:00-03:00'
                    actualizado_en: '2026-11-19T17:05:00-03:00'
                pagina: 1
                tamanio: 20
                total: 1
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '429':
          $ref: '#/components/responses/DemasiadosPedidos'
        '503':
          $ref: '#/components/responses/NoDisponible'
        '502':
          $ref: '#/components/responses/ErrorDePuerta'
        '504':
          $ref: '#/components/responses/TiempoAgotado'

  /traslados/{id}:
    get:
      tags: [Traslados]
      operationId: obtenerTraslado
      summary: Consultar un traslado
      description: Estado actual del traslado reservado.
      parameters:
        - $ref: '#/components/parameters/IdTraslado'
      responses:
        '200':
          description: Traslado encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrasladoReservado'
              examples:
                programado:
                  $ref: '#/components/examples/TrasladoProgramado'
                completado:
                  $ref: '#/components/examples/TrasladoCompletado'
                noRealizado:
                  $ref: '#/components/examples/TrasladoNoRealizado'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrada'
        '429':
          $ref: '#/components/responses/DemasiadosPedidos'
        '503':
          $ref: '#/components/responses/NoDisponible'
        '502':
          $ref: '#/components/responses/ErrorDePuerta'
        '504':
          $ref: '#/components/responses/TiempoAgotado'

  /traslados/{id}/cancelacion:
    post:
      tags: [Traslados]
      operationId: cancelarTraslado
      summary: Cancelar un traslado
      description: |
        Cancela en el momento un traslado que todavía no empezó (`PROGRAMADO` o `ASIGNADO`): pasa
        a `CANCELADO` y el lugar de la franja queda libre. No requiere aprobación de nadie.

        - Con **menos de 24 h** antes del fin de la franja, la cancelación se aplica igual y queda
          marcada como `cancelacion.tardia = true` (Rumbo la registra para su operación).
        - Con el traslado `EN_CURSO` o terminado: no se puede cancelar (`409`).
      parameters:
        - $ref: '#/components/parameters/IdTraslado'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoCancelacion'
            example:
              motivo: La mercadería se despachó por otro medio.
      responses:
        '200':
          description: Traslado cancelado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrasladoReservado'
              examples:
                cancelado:
                  $ref: '#/components/examples/TrasladoCancelado'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrada'
        '409':
          $ref: '#/components/responses/ConflictoCancelacion'
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
        '429':
          $ref: '#/components/responses/DemasiadosPedidos'
        '503':
          $ref: '#/components/responses/NoDisponible'
        '502':
          $ref: '#/components/responses/ErrorDePuerta'
        '504':
          $ref: '#/components/responses/TiempoAgotado'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token obtenido en `POST /auth/token`.

  parameters:
    IdTraslado:
      name: id
      in: path
      required: true
      description: Identificador del traslado asignado por Rumbo (el de la respuesta de la reserva).
      schema:
        type: string
      example: sol-7f3a9c
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Clave única por intención (se recomienda un UUID). Rumbo la conserva junto con el cuerpo
        y el resultado: el mismo par clave + cuerpo devuelve el mismo resultado; la misma clave
        con otro cuerpo devuelve `409 CLAVE_IDEMPOTENCIA_REUTILIZADA`.
      schema:
        type: string
        minLength: 8
        maxLength: 128
      example: 3f6c1e2a-8b4d-4c1e-9a7f-2d5b6e8c9a01

  schemas:
    PedidoToken:
      type: object
      required: [client_id, client_secret]
      properties:
        client_id:
          type: string
        client_secret:
          type: string
    Token:
      type: object
      required: [access_token, token_type, expira_en_segundos]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expira_en_segundos:
          type: integer

    Ubicacion:
      type: object
      required: [nombre, direccion]
      properties:
        nombre:
          type: string
          maxLength: 120
          description: Nombre de la sucursal o lugar.
        direccion:
          type: string
          maxLength: 250
        contacto:
          type: string
          maxLength: 120
          description: Persona o teléfono para coordinar en el lugar.

    Cosa:
      type: object
      description: Lo que hay que trasladar.
      required: [descripcion, cantidad]
      properties:
        descripcion:
          type: string
          maxLength: 250
          description: Qué se traslada (ej. "cajas de mercadería seca").
        cantidad:
          type: integer
          minimum: 1
          description: Cantidad de unidades o bultos.
        peso_kg:
          type: number
          exclusiveMinimum: 0
          description: Opcional. Peso total; descuenta del cupo de kg de la franja. Sin peso, ocupa igual un lugar.
        volumen_m3:
          type: number
          exclusiveMinimum: 0
          description: Opcional. Volumen total.

    Franja:
      type: object
      description: Ventana en la que la cosa llega al destino. Rumbo se compromete a que llegue antes de `fin`.
      required: [inicio, fin]
      properties:
        inicio:
          type: string
          format: date-time
        fin:
          type: string
          format: date-time

    FranjaDisponible:
      type: object
      required: [inicio, fin, disponible, traslados_disponibles, kg_disponibles]
      properties:
        inicio:
          type: string
          format: date-time
          description: Valor a enviar como `franja_inicio` para reservar.
        fin:
          type: string
          format: date-time
        disponible:
          type: boolean
          description: Si una carga del `peso_kg` consultado (o sin peso) entra hoy en la franja.
        traslados_disponibles:
          type: integer
          minimum: 0
          description: Reservas que todavía entran en la franja.
        kg_disponibles:
          type: number
          minimum: 0
          description: Peso que todavía entra en la franja.

    Disponibilidad:
      type: object
      required: [fecha, franjas]
      properties:
        fecha:
          type: string
          format: date
        franjas:
          type: array
          items:
            $ref: '#/components/schemas/FranjaDisponible'

    NuevoTraslado:
      type: object
      required: [cosa, origen, destino, franja_inicio]
      properties:
        referencia_externa:
          type: string
          maxLength: 64
          description: Opcional. Identificador de la operación en el sistema del consumidor (Rumbo lo devuelve tal cual).
        cosa:
          $ref: '#/components/schemas/Cosa'
        origen:
          $ref: '#/components/schemas/Ubicacion'
        destino:
          $ref: '#/components/schemas/Ubicacion'
        franja_inicio:
          type: string
          format: date-time
          description: Inicio de la franja a reservar, tal como lo devuelve `GET /disponibilidad` (ISO 8601 con zona horaria).
        observaciones:
          type: string
          maxLength: 500

    EstadoTraslado:
      type: string
      enum: [PROGRAMADO, ASIGNADO, EN_CURSO, COMPLETADO, CANCELADO, NO_REALIZADO, INTERRUMPIDO]
      description: |
        - `PROGRAMADO`: reservado; Rumbo se comprometió a la franja.
        - `ASIGNADO`: ya tiene chofer y vehículo.
        - `EN_CURSO`: el chofer inició el traslado.
        - `COMPLETADO`: la cosa llegó al destino. Final.
        - `CANCELADO`: cancelado antes de iniciar. Final.
        - `NO_REALIZADO`: no se pudo retirar la cosa en el origen. Final.
        - `INTERRUMPIDO`: empezó y no terminó (por ejemplo, avería). Final.

    Cancelacion:
      type: object
      required: [tardia, cancelada_en]
      properties:
        motivo:
          type: string
        tardia:
          type: boolean
          description: Se canceló con menos de 24 h de anticipación.
        cancelada_en:
          type: string
          format: date-time

    TrasladoReservado:
      type: object
      required: [id, estado, cosa, origen, destino, franja, creado_en, actualizado_en]
      properties:
        id:
          type: string
        referencia_externa:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoTraslado'
        cosa:
          $ref: '#/components/schemas/Cosa'
        origen:
          $ref: '#/components/schemas/Ubicacion'
        destino:
          $ref: '#/components/schemas/Ubicacion'
        observaciones:
          type: string
        franja:
          $ref: '#/components/schemas/Franja'
        demora_minutos:
          type: integer
          minimum: 0
          description: Retraso informado durante la ejecución (la demora no es un estado).
        finalizado_en:
          type: string
          format: date-time
        detalle_resultado:
          type: string
          description: Explicación cuando el traslado es `NO_REALIZADO` o `INTERRUMPIDO`.
        cancelacion:
          $ref: '#/components/schemas/Cancelacion'
        creado_en:
          type: string
          format: date-time
        actualizado_en:
          type: string
          format: date-time

    PaginaTraslados:
      type: object
      required: [resultados, pagina, tamanio, total]
      properties:
        resultados:
          type: array
          items:
            $ref: '#/components/schemas/TrasladoReservado'
        pagina:
          type: integer
        tamanio:
          type: integer
        total:
          type: integer

    PedidoCancelacion:
      type: object
      required: [motivo]
      properties:
        motivo:
          type: string
          maxLength: 500

    Problema:
      type: object
      description: Error en formato Problem Details (RFC 9457), con un `codigo` estable para que el consumidor decida qué hacer.
      required: [type, title, status, codigo]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        codigo:
          type: string
          enum:
            - JSON_MAL_FORMADO
            - DATOS_INVALIDOS
            - NO_AUTENTICADO
            - SIN_PERMISO
            - NO_ENCONTRADA
            - CLAVE_IDEMPOTENCIA_REUTILIZADA
            - SIN_DISPONIBILIDAD
            - ESTADO_NO_PERMITE_OPERACION
            - HORARIO_EN_EL_PASADO
            - ANTICIPACION_INSUFICIENTE
            - EXCEDE_CAPACIDAD
            - DEMASIADOS_PEDIDOS
            - SERVICIO_NO_DISPONIBLE
            - TIEMPO_AGOTADO
        errores:
          type: array
          description: Detalle por campo cuando `codigo = DATOS_INVALIDOS`.
          items:
            type: object
            properties:
              campo:
                type: string
              mensaje:
                type: string

  responses:
    PedidoInvalido:
      description: El cuerpo no es JSON válido o un parámetro tiene un formato inválido. No reintentar sin corregir.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://rumbo.example/errores/json-mal-formado
            title: Pedido mal formado
            status: 400
            codigo: JSON_MAL_FORMADO
    NoAutenticado:
      description: Falta el token, está vencido o es inválido (o credenciales incorrectas en `/auth/token`). Obtener un token nuevo.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://rumbo.example/errores/no-autenticado
            title: No autenticado
            status: 401
            codigo: NO_AUTENTICADO
    SinPermiso:
      description: La organización autenticada no está habilitada para reservar traslados.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://rumbo.example/errores/sin-permiso
            title: Sin permiso
            status: 403
            codigo: SIN_PERMISO
    NoEncontrada:
      description: El traslado no existe o pertenece a otra organización.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://rumbo.example/errores/no-encontrada
            title: Traslado no encontrado
            status: 404
            codigo: NO_ENCONTRADA
    ConflictoReserva:
      description: |
        - `SIN_DISPONIBILIDAD`: la franja ya no tiene lugar para esta carga. Consultar
          `GET /disponibilidad` y reservar otra franja con una clave nueva.
        - `CLAVE_IDEMPOTENCIA_REUTILIZADA`: la `Idempotency-Key` ya se usó con un cuerpo distinto.
          Usar una clave nueva para una intención nueva.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            sinDisponibilidad:
              value:
                type: https://rumbo.example/errores/sin-disponibilidad
                title: Sin disponibilidad
                status: 409
                codigo: SIN_DISPONIBILIDAD
                detail: La franja ya no tiene lugar para esta carga. Consultar la disponibilidad y elegir otra.
            claveReutilizada:
              value:
                type: https://rumbo.example/errores/clave-idempotencia-reutilizada
                title: Clave de idempotencia reutilizada
                status: 409
                codigo: CLAVE_IDEMPOTENCIA_REUTILIZADA
    ConflictoCancelacion:
      description: |
        - `ESTADO_NO_PERMITE_OPERACION`: el traslado ya empezó o terminó. No reintentar; consultar el traslado.
        - `CLAVE_IDEMPOTENCIA_REUTILIZADA`: la `Idempotency-Key` ya se usó con un cuerpo distinto.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://rumbo.example/errores/estado-no-permite-operacion
            title: El estado actual no permite la operación
            status: 409
            codigo: ESTADO_NO_PERMITE_OPERACION
            detail: El traslado ya está EN_CURSO.
    ReglaDeNegocio:
      description: |
        Los datos no cumplen el contrato (`DATOS_INVALIDOS`, con detalle por campo en `errores`; por
        ejemplo, una `franja_inicio` que no es el inicio de una franja o una fecha fuera del período
        reservable) o no cumplen una regla de negocio:
        - `ANTICIPACION_INSUFICIENTE`: la franja empieza en menos de 2 h.
        - `HORARIO_EN_EL_PASADO`: la franja ya empezó.
        - `EXCEDE_CAPACIDAD`: el peso supera el cupo total de una franja; dividir la carga.
        No reintentar sin cambiar el pedido.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            datosInvalidos:
              value:
                type: https://rumbo.example/errores/datos-invalidos
                title: Datos inválidos
                status: 422
                codigo: DATOS_INVALIDOS
                errores:
                  - campo: franja_inicio
                    mensaje: no es el inicio de una franja reservable
            anticipacionInsuficiente:
              value:
                type: https://rumbo.example/errores/anticipacion-insuficiente
                title: Anticipación insuficiente
                status: 422
                codigo: ANTICIPACION_INSUFICIENTE
                detail: La franja empieza demasiado pronto para reservarla. Elegir una franja posterior.
            excedeCapacidad:
              value:
                type: https://rumbo.example/errores/excede-capacidad
                title: Excede la capacidad
                status: 422
                codigo: EXCEDE_CAPACIDAD
                detail: El peso supera el cupo total de una franja; dividir la carga en varios traslados.
    DemasiadosPedidos:
      description: Se superó el límite de pedidos de la organización. Reintentar después de `Retry-After` segundos.
      headers:
        Retry-After:
          schema:
            type: integer
          example: 30
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://rumbo.example/errores/demasiados-pedidos
            title: Demasiados pedidos
            status: 429
            codigo: DEMASIADOS_PEDIDOS
    NoDisponible:
      description: Rumbo no puede procesar el pedido en este momento. Es seguro reintentar con backoff y la **misma** `Idempotency-Key`.
      headers:
        Retry-After:
          schema:
            type: integer
          example: 30
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://rumbo.example/errores/servicio-no-disponible
            title: Servicio no disponible
            status: 503
            codigo: SERVICIO_NO_DISPONIBLE
    ErrorDePuerta:
      description: El punto de entrada de Rumbo no pudo comunicarse con el servicio que atiende el pedido. Es seguro reintentar con backoff y la **misma** `Idempotency-Key`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://rumbo.example/errores/servicio-no-disponible
            title: Servicio no disponible
            status: 502
            codigo: SERVICIO_NO_DISPONIBLE
    TiempoAgotado:
      description: Rumbo no respondió dentro de los 5 s. **El pedido pudo haberse procesado**; reintentar con la **misma** `Idempotency-Key` para obtener el resultado sin duplicar.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://rumbo.example/errores/tiempo-agotado
            title: Tiempo agotado
            status: 504
            codigo: TIEMPO_AGOTADO

