# Alertas de Rumbo (ADR-014): el SLO de la capacidad publicada y la DLQ.
# Grafana las carga al iniciar (provisioning); se montan en la carpeta de alertas de la imagen
# grafana/otel-lgtm (ver el bloque lgtm de compose.yaml).
#
# El SLO se mide en el gateway: es lo que ve el consumidor del contrato (incluye el salto de red
# hacia Integración). La ruta del gateway agrupa /traslados y /traslados/{id}.
apiVersion: 1

groups:
  - orgId: 1
    name: rumbo-slo
    folder: Rumbo
    interval: 1m
    rules:
      - uid: rumbo-slo-latencia-traslados
        title: SLO latencia traslados
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severidad: critica
        annotations:
          summary: "El p95 de POST /traslados superó los 300 ms"
          description: "SLO: 99 % de los POST /traslados responden en menos de 300 ms. El p95 de los últimos 5 minutos está por encima del objetivo."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'histogram_quantile(0.95, sum by (le) (rate(rumbo_http_duracion_segundos_seconds_bucket{job="gateway",ruta="/traslados",metodo="POST"}[5m])))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.3] }
              refId: C

      - uid: rumbo-slo-errores-traslados
        title: SLO errores traslados
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severidad: critica
        annotations:
          summary: "Más del 1 % de las respuestas de /traslados son 5xx"
          description: "SLO: menos del 1 % de respuestas 5xx. La tasa de los últimos 5 minutos está por encima del objetivo."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'sum(rate(rumbo_http_duracion_segundos_seconds_count{job="gateway",ruta="/traslados",estado=~"5.."}[5m])) / sum(rate(rumbo_http_duracion_segundos_seconds_count{job="gateway",ruta="/traslados"}[5m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.01] }
              refId: C

      - uid: rumbo-dlq-mensajes
        title: Mensajes en DLQ
        condition: C
        # 1 min y no 5: la condición mira los últimos 5 min, así que con un solo mensaje es
        # verdadera exactamente 5 min y con "for: 5m" nunca llegaba a dispararse (ADR-016).
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severidad: alta
        annotations:
          summary: "Hay mensajes enviados a una DLQ"
          description: "Algún consumidor envió mensajes a su cola de mensajes fallidos (<cola>.dlq) en los últimos 5 minutos. Cada DLQ tiene dueño: el equipo del servicio consumidor."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              # Diferencia contra hace 5 min; "or vector(0)" cubre el primer mensaje en DLQ, cuando
              # la serie todavía no existía hace 5 min (increase() necesita dos muestras).
              expr: 'sum(rumbo_mensajes_procesados_total{resultado="dlq"}) - (sum(rumbo_mensajes_procesados_total{resultado="dlq"} offset 5m) or vector(0))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C
