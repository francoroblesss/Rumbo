events {}

http {
    # Log de acceso con la réplica que atendió cada request: evidencia de la distribución (ADR-009).
    log_format rumbo '$time_iso8601 "$request" estado=$status replica=$upstream_addr '
                     'tiempo=$upstream_response_time correlation=$http_x_correlation_id';
    access_log /dev/stdout rumbo;

    # DNS interno de Docker. Las réplicas se vuelven a resolver cada 10 s: si una se reinicia con
    # otra IP, NGINX la encuentra sin reiniciarse (ADR-016). Requiere NGINX 1.27.3 o posterior.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream integracion {
        # Memoria compartida: la necesita "resolve" para actualizar las direcciones.
        zone integracion 64k;
        # Round robin. Health check pasivo: 3 fallas en 30 s sacan a la réplica de rotación 30 s.
        server integracion-1:8085 max_fails=3 fail_timeout=30s resolve;
        server integracion-2:8085 max_fails=3 fail_timeout=30s resolve;
        keepalive 32;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://integracion;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
            # Reintento en la otra réplica solo ante caída o timeout, y solo para métodos
            # idempotentes (NGINX no reintenta POST sin "non_idempotent").
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }
    }
}
