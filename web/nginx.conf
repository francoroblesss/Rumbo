# Sirve la SPA: cualquier ruta que no sea un archivo (por ejemplo /traslados/sol-…) devuelve
# index.html, y el ruteo lo resuelve React Router en el navegador.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash en el nombre no cambian nunca: se pueden guardar en caché.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
